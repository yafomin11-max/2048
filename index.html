<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Python 2048 Mini App</title>
    <style>
        body { background-color: #faf8ef; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .grid { background: #bbada0; width: 320px; height: 320px; padding: 10px; border-radius: 6px; display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 10px; }
        .cell { width: 72.5px; height: 72.5px; background: rgba(238, 228, 218, 0.35); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: bold; color: #776e65; }
        /* Cveta dlya kletok */
        .n2 { background: #eee4da; } .n4 { background: #ede0c8; }
        .n8 { background: #f2b179; color: white; } .n16 { background: #f59563; color: white; }
        .n32 { background: #f67c5f; color: white; } .n64 { background: #f65e3b; color: white; }
        .n128 { background: #edcf72; color: white; font-size: 20px; }
        .n_big { background: #3c3a32; color: white; font-size: 20px; }
    </style>
</head>
<body>
    <h1 id="score">Schet: 0</h1>
    <div class="grid" id="grid"></div>

    <script>
        let pole = Array(16).fill(0);
        let schet = 0;

        function obnovit() {
            const g = document.getElementById('grid');
            g.innerHTML = '';
            pole.forEach(v => {
                const c = document.createElement('div');
                c.className = 'cell' + (v > 0 ? (v <= 128 ? ' n' + v : ' n_big') : '');
                c.innerText = v > 0 ? v : '';
                g.appendChild(c);
            });
            document.getElementById('score').innerText = "Schet: " + schet;
        }

        function dobavit() {
            let p = pole.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if(p.length) pole[p[Math.floor(Math.random()*p.length)]] = Math.random() < 0.9 ? 2 : 4;
        }

        // Uproshchennaya logika dlya primera
        window.addEventListener('keydown', (e) => {
            // Tut doljen bit sdvig, dlya testa dobavim prosto pri najatii
            dobavit(); obnovit();
        });

        // Dlya smartphonov
        document.addEventListener('click', () => { dobavit(); obnovit(); });

        dobavit(); dobavit(); obnovit();
    </script>
</body>
</html>
